{% extends "base.html" %}
{% block title %}Chats - Telegram Sender{% endblock %}

{% block content %}
<style>
    .chat-layout {
        display: grid;
        grid-template-columns: 340px 1fr;
        gap: 0;
        height: calc(100vh - 48px);
        margin: -24px -32px;
    }

    /* Conversation list */
    .conv-panel {
        background: var(--bg-card);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    .conv-header {
        padding: 16px;
        border-bottom: 1px solid var(--border);
        font-size: 18px;
        font-weight: 600;
    }

    .conv-search {
        padding: 8px 16px;
        border-bottom: 1px solid var(--border);
    }

    .conv-search input {
        width: 100%;
        padding: 8px 12px;
        background: var(--bg-input);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        color: var(--text);
        font-size: 13px;
    }

    .conv-search input:focus {
        outline: none;
        border-color: var(--primary);
    }

    .conv-list {
        flex: 1;
        overflow-y: auto;
    }

    .conv-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        cursor: pointer;
        border-bottom: 1px solid var(--border);
        transition: background 0.15s;
    }

    .conv-item:hover { background: rgba(255,255,255,0.03); }
    .conv-item.active { background: rgba(99,102,241,0.1); border-right: 3px solid var(--primary); }

    .conv-avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--primary);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 16px;
        flex-shrink: 0;
        color: #fff;
    }

    .conv-info { flex: 1; min-width: 0; }

    .conv-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 3px;
    }

    .conv-name {
        font-size: 14px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .conv-time {
        font-size: 11px;
        color: var(--text-muted);
        flex-shrink: 0;
    }

    .conv-preview {
        font-size: 12px;
        color: var(--text-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .conv-unread {
        background: var(--primary);
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        min-width: 20px;
        height: 20px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 6px;
        flex-shrink: 0;
    }

    /* Message panel */
    .msg-panel {
        display: flex;
        flex-direction: column;
        background: var(--bg);
        overflow: hidden;
    }

    .msg-header {
        padding: 14px 20px;
        border-bottom: 1px solid var(--border);
        background: var(--bg-card);
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .msg-header-name {
        font-size: 15px;
        font-weight: 600;
    }

    .msg-header-username {
        font-size: 12px;
        color: var(--text-muted);
    }

    .msg-body {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .msg-empty {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-muted);
        font-size: 15px;
    }

    /* Chat bubbles */
    .msg-row {
        display: flex;
        max-width: 70%;
    }

    .msg-row.outgoing {
        align-self: flex-end;
    }

    .msg-row.incoming {
        align-self: flex-start;
    }

    .msg-bubble {
        padding: 10px 14px;
        border-radius: 12px;
        font-size: 14px;
        line-height: 1.45;
        word-break: break-word;
        white-space: pre-wrap;
    }

    .msg-row.outgoing .msg-bubble {
        background: var(--primary);
        color: #fff;
        border-bottom-right-radius: 4px;
    }

    .msg-row.incoming .msg-bubble {
        background: var(--bg-card);
        border: 1px solid var(--border);
        color: var(--text);
        border-bottom-left-radius: 4px;
    }

    .msg-meta {
        display: flex;
        align-items: center;
        gap: 4px;
        margin-top: 4px;
        justify-content: flex-end;
    }

    .msg-row.incoming .msg-meta {
        justify-content: flex-start;
    }

    .msg-time {
        font-size: 10px;
        color: rgba(255,255,255,0.5);
    }

    .msg-row.incoming .msg-time {
        color: var(--text-muted);
    }

    .msg-status {
        font-size: 12px;
        line-height: 1;
    }

    .msg-status.sent { color: rgba(255,255,255,0.5); }
    .msg-status.delivered { color: rgba(255,255,255,0.7); }
    .msg-status.read { color: #34d399; }

    /* Reply box */
    .reply-box {
        padding: 12px 20px;
        border-top: 1px solid var(--border);
        background: var(--bg-card);
        display: flex;
        gap: 10px;
        align-items: flex-end;
    }

    .reply-box textarea {
        flex: 1;
        padding: 10px 14px;
        background: var(--bg-input);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        color: var(--text);
        font-size: 14px;
        font-family: inherit;
        resize: none;
        min-height: 42px;
        max-height: 120px;
        line-height: 1.4;
    }

    .reply-box textarea:focus {
        outline: none;
        border-color: var(--primary);
    }

    .reply-box .btn {
        height: 42px;
        padding: 0 20px;
    }

    /* Nav badge */
    .nav-badge {
        background: var(--danger);
        color: #fff;
        font-size: 10px;
        font-weight: 700;
        min-width: 18px;
        height: 18px;
        border-radius: 9px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 5px;
        margin-left: 4px;
    }
</style>

<div class="chat-layout">
    <!-- Conversation list panel -->
    <div class="conv-panel">
        <div class="conv-header" style="display:flex;justify-content:space-between;align-items:center">
            <span>Chats</span>
            <button class="btn btn-sm btn-outline" id="check-status-btn" onclick="refreshReadStatus()" title="Check read status from Telegram">Refresh Status</button>
        </div>
        <div style="padding:6px 16px;border-bottom:1px solid var(--border);display:flex;gap:12px;font-size:12px;color:var(--text-muted)">
            <span>Total: <strong id="stat-total">0</strong></span>
            <span>Read: <strong id="stat-read" style="color:var(--success)">0</strong></span>
            <span>Unread: <strong id="stat-unread" style="color:var(--warning)">0</strong></span>
            <span>Replied: <strong id="stat-replied" style="color:var(--primary)">0</strong></span>
        </div>
        <div class="conv-search">
            <input type="text" id="conv-search" placeholder="Search name, username, phone...">
        </div>
        <div class="conv-list" id="conv-list">
            <div class="msg-empty" id="conv-empty">No conversations yet</div>
        </div>
    </div>

    <!-- Message panel -->
    <div class="msg-panel" id="msg-panel">
        <div class="msg-empty" id="msg-placeholder">Select a conversation to view messages</div>

        <div id="msg-active" style="display:none; flex:1; display:none; flex-direction:column; height:100%;">
            <div class="msg-header" id="msg-header">
                <div class="conv-avatar" id="msg-avatar"></div>
                <div>
                    <div class="msg-header-name" id="msg-name"></div>
                    <div class="msg-header-username" id="msg-username"></div>
                </div>
            </div>
            <div class="msg-body" id="msg-body"></div>
            <div class="reply-box">
                <textarea id="reply-input" rows="1" placeholder="Type a message..."></textarea>
                <button class="btn btn-primary" id="send-btn" onclick="sendReply()">Send</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let conversations = [];
let activeUserId = null;
let sseSource = null;

// Load conversations
async function loadConversations() {
    const res = await fetch('/api/chats');
    conversations = await res.json();
    renderConversations();
}

function renderConversations(filter = '') {
    const list = document.getElementById('conv-list');
    const empty = document.getElementById('conv-empty');
    const filtered = conversations.filter(c => {
        if (!filter) return true;
        const s = filter.toLowerCase();
        return (c.tg_name || '').toLowerCase().includes(s)
            || (c.tg_username || '').toLowerCase().includes(s)
            || (c.contact_phone || '').includes(s);
    });

    // Update stats
    document.getElementById('stat-total').textContent = conversations.length;
    document.getElementById('stat-read').textContent = conversations.filter(c => c.read_count > 0).length;
    document.getElementById('stat-unread').textContent = conversations.filter(c => c.read_count === 0 && !c.has_reply).length;
    document.getElementById('stat-replied').textContent = conversations.filter(c => c.has_reply).length;

    if (filtered.length === 0) {
        list.innerHTML = '';
        list.appendChild(empty);
        empty.style.display = 'flex';
        return;
    }

    empty.style.display = 'none';
    list.innerHTML = filtered.map(c => {
        const initial = (c.tg_name || c.tg_username || '?')[0].toUpperCase();
        const name = (c.tg_name && c.tg_name !== 'Contact' ? c.tg_name : null) || c.tg_username || c.contact_phone || `User ${c.tg_user_id}`;
        const isActive = c.tg_user_id === activeUserId ? ' active' : '';
        const unread = c.unread > 0 ? `<span class="conv-unread">${c.unread}</span>` : '';
        const dirPrefix = c.last_direction === 'outgoing' ? 'You: ' : '';

        // Status badge
        let badge = '';
        if (c.has_reply) {
            badge = '<span style="color:var(--success);font-size:10px;font-weight:700">REPLIED</span>';
        } else if (c.read_count > 0) {
            badge = '<span style="color:#34d399;font-size:10px;font-weight:700">READ</span>';
        } else {
            badge = '<span style="color:var(--text-muted);font-size:10px">sent</span>';
        }

        return `
            <div class="conv-item${isActive}" data-uid="${c.tg_user_id}" onclick="openChat(${c.tg_user_id})">
                <div class="conv-avatar">${initial}</div>
                <div class="conv-info">
                    <div class="conv-top">
                        <span class="conv-name">${escHtml(name)}</span>
                        <span class="conv-time">${c.last_time}</span>
                    </div>
                    <div class="conv-preview" style="display:flex;justify-content:space-between;align-items:center">
                        <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${dirPrefix}${escHtml(c.last_message)}</span>
                        ${badge}
                    </div>
                </div>
                ${unread}
            </div>
        `;
    }).join('');
}

function escHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
}

// Open chat
async function openChat(tgUserId) {
    activeUserId = tgUserId;

    // Highlight active conversation
    document.querySelectorAll('.conv-item').forEach(el => {
        el.classList.toggle('active', parseInt(el.dataset.uid) === tgUserId);
    });

    // Show message panel
    document.getElementById('msg-placeholder').style.display = 'none';
    const active = document.getElementById('msg-active');
    active.style.display = 'flex';

    // Set header
    const conv = conversations.find(c => c.tg_user_id === tgUserId);
    if (conv) {
        const name = (conv.tg_name && conv.tg_name !== 'Contact' ? conv.tg_name : null) || conv.tg_username || conv.contact_phone || `User ${tgUserId}`;
        document.getElementById('msg-avatar').textContent = name[0].toUpperCase();
        document.getElementById('msg-name').textContent = name;
        document.getElementById('msg-username').textContent = conv.tg_username ? `@${conv.tg_username}` : '';
    }

    // Load messages
    const res = await fetch(`/api/chats/${tgUserId}/messages?per_page=200`);
    const data = await res.json();
    const body = document.getElementById('msg-body');
    body.innerHTML = '';

    data.messages.forEach(m => {
        appendMessage(m);
    });

    body.scrollTop = body.scrollHeight;

    // Mark as read
    fetch(`/api/chats/${tgUserId}/read`, { method: 'POST' });

    // Update unread in sidebar
    if (conv) conv.unread = 0;
    renderConversations(document.getElementById('conv-search').value);
}

function statusIcon(status) {
    // Single check = sent, double check green = read
    if (status === 'read') return '<span class="msg-status read" title="Read">&#10003;&#10003;</span>';
    return '<span class="msg-status sent" title="Sent">&#10003;</span>';
}

function appendMessage(m) {
    const body = document.getElementById('msg-body');
    const row = document.createElement('div');
    row.className = `msg-row ${m.direction}`;
    if (m.tg_message_id) row.dataset.msgId = m.tg_message_id;

    const time = m.created_at.split(' ')[1] || m.created_at;
    const checks = m.direction === 'outgoing' ? statusIcon(m.delivery_status || 'sent') : '';
    row.innerHTML = `
        <div>
            <div class="msg-bubble">${escHtml(m.text)}</div>
            <div class="msg-meta">
                <span class="msg-time">${time}</span>
                ${checks}
            </div>
        </div>
    `;
    body.appendChild(row);
}

// Send reply
async function sendReply() {
    if (!activeUserId) return;
    const input = document.getElementById('reply-input');
    const text = input.value.trim();
    if (!text) return;

    const btn = document.getElementById('send-btn');
    btn.disabled = true;
    input.value = '';

    try {
        const res = await fetch(`/api/chats/${activeUserId}/send`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text })
        });
        const data = await res.json();
        if (data.error) {
            showToast(data.error, 'error');
            return;
        }
        appendMessage(data);
        document.getElementById('msg-body').scrollTop = document.getElementById('msg-body').scrollHeight;
        loadConversations();
    } catch (e) {
        showToast('Failed to send message', 'error');
    } finally {
        btn.disabled = false;
        input.focus();
    }
}

// Enter to send, Shift+Enter for newline
document.getElementById('reply-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendReply();
    }
});

// Auto-resize textarea
document.getElementById('reply-input').addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

// Search
document.getElementById('conv-search').addEventListener('input', function() {
    renderConversations(this.value);
});

// SSE for real-time messages
function connectSSE() {
    if (sseSource) sseSource.close();
    sseSource = new EventSource('/api/chats/stream');

    sseSource.onmessage = function(e) {
        const data = JSON.parse(e.data);

        if (data.type === 'new_message') {
            const msg = data.message;

            // If this chat is open, append the message
            if (msg.tg_user_id === activeUserId) {
                appendMessage(msg);
                document.getElementById('msg-body').scrollTop = document.getElementById('msg-body').scrollHeight;
                // Mark as read
                fetch(`/api/chats/${msg.tg_user_id}/read`, { method: 'POST' });
            }

            // Refresh conversation list
            loadConversations();
        }

        if (data.type === 'read_receipt') {
            // Update checkmarks on outgoing messages for this user
            if (data.tg_user_id === activeUserId) {
                document.querySelectorAll('.msg-row.outgoing').forEach(row => {
                    const msgId = parseInt(row.dataset.msgId);
                    if (msgId && msgId <= data.max_id) {
                        const statusEl = row.querySelector('.msg-status');
                        if (statusEl && !statusEl.classList.contains('read')) {
                            statusEl.className = 'msg-status read';
                            statusEl.innerHTML = '&#10003;&#10003;';
                            statusEl.title = 'Read';
                        }
                    }
                });
            }
        }
    };

    sseSource.onerror = function() {
        sseSource.close();
        setTimeout(connectSSE, 3000);
    };
}

// Refresh read status from Telegram
async function refreshReadStatus() {
    const btn = document.getElementById('check-status-btn');
    btn.disabled = true;
    btn.textContent = 'Checking...';
    try {
        const res = await fetch('/api/chats/check-status', { method: 'POST' });
        const data = await res.json();
        if (data.error) {
            showToast(data.error, 'error');
        } else {
            showToast(`Updated ${data.updated} conversations`, 'success');
        }
        // Reload conversations to reflect new statuses
        await loadConversations();
        // If a chat is open, reload its messages
        if (activeUserId) openChat(activeUserId);
    } catch (e) {
        showToast('Failed to check status', 'error');
    } finally {
        btn.disabled = false;
        btn.textContent = 'Refresh Status';
    }
}

// Init — load conversations then auto-check read status
async function init() {
    await loadConversations();
    connectSSE();
    // Auto-check read status on page load
    refreshReadStatus();
}
init();
</script>
{% endblock %}
