{% extends "base.html" %}
{% block title %}Chats - Telegram Sender{% endblock %}

{% block content %}
<div class="chat-layout">
    <!-- Conversation list panel -->
    <div class="conv-panel">
        <div class="conv-header">
            <span>Chats</span>
            <button class="btn btn-sm btn-outline" id="check-status-btn" onclick="refreshReadStatus()" title="Check read status from Telegram">
                <i data-lucide="refresh-cw" class="icon-sm"></i> Refresh
            </button>
        </div>
        <div class="conv-stats">
            <span>Total: <strong id="stat-total">0</strong></span>
            <span>Read: <strong class="text-success" id="stat-read">0</strong></span>
            <span>Unread: <strong class="text-warning" id="stat-unread">0</strong></span>
            <span>Replied: <strong class="text-primary" id="stat-replied">0</strong></span>
        </div>
        <div class="conv-search">
            <input type="text" id="conv-search" placeholder="Search name, username, phone...">
        </div>
        <div class="conv-list" id="conv-list">
            <div class="msg-empty" id="conv-empty">
                <i data-lucide="message-circle" style="width:32px;height:32px;opacity:0.3"></i>
                No conversations yet
            </div>
        </div>
    </div>

    <!-- Message panel -->
    <div class="msg-panel" id="msg-panel">
        <div class="msg-empty" id="msg-placeholder">
            <i data-lucide="messages-square" style="width:48px;height:48px;opacity:0.2"></i>
            Select a conversation to view messages
        </div>

        <div id="msg-active" style="display:none; flex-direction:column; height:100%">
            <div class="msg-header" id="msg-header">
                <div class="conv-avatar" id="msg-avatar"></div>
                <div>
                    <div class="msg-header-name" id="msg-name"></div>
                    <div class="msg-header-username" id="msg-username"></div>
                </div>
            </div>

            <!-- Loading skeleton -->
            <div class="msg-loading hidden" id="msg-loading">
                <div class="spinner"></div>
                <span class="text-sm text-muted">Loading messages...</span>
            </div>

            <div class="msg-body" id="msg-body"></div>
            <div class="reply-box">
                <textarea id="reply-input" rows="1" placeholder="Type a message..."></textarea>
                <button class="btn btn-primary" id="send-btn" onclick="sendReply()">
                    <i data-lucide="send" class="icon-base"></i>
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let conversations = [];
let activeUserId = null;
let sseSource = null;

// Load conversations
async function loadConversations() {
    const res = await fetch('/api/chats');
    conversations = await res.json();
    renderConversations();
}

function renderConversations(filter = '') {
    const list = document.getElementById('conv-list');
    const empty = document.getElementById('conv-empty');
    const filtered = conversations.filter(c => {
        if (!filter) return true;
        const s = filter.toLowerCase();
        return (c.tg_name || '').toLowerCase().includes(s)
            || (c.tg_username || '').toLowerCase().includes(s)
            || (c.contact_phone || '').includes(s);
    });

    // Update stats
    document.getElementById('stat-total').textContent = conversations.length;
    document.getElementById('stat-read').textContent = conversations.filter(c => c.read_count > 0).length;
    document.getElementById('stat-unread').textContent = conversations.filter(c => c.read_count === 0 && !c.has_reply).length;
    document.getElementById('stat-replied').textContent = conversations.filter(c => c.has_reply).length;

    if (filtered.length === 0) {
        list.innerHTML = '';
        list.appendChild(empty);
        empty.style.display = 'flex';
        return;
    }

    empty.style.display = 'none';
    list.innerHTML = filtered.map(c => {
        const initial = (c.tg_name || c.tg_username || '?')[0].toUpperCase();
        const name = (c.tg_name && c.tg_name !== 'Contact' ? c.tg_name : null) || c.tg_username || c.contact_phone || `User ${c.tg_user_id}`;
        const isActive = c.tg_user_id === activeUserId ? ' active' : '';
        const unread = c.unread > 0 ? `<span class="conv-unread">${c.unread}</span>` : '';
        const dirPrefix = c.last_direction === 'outgoing' ? 'You: ' : '';

        // Status badge
        let badge = '';
        if (c.has_reply) {
            badge = '<span class="badge badge-success badge-sm">REPLIED</span>';
        } else if (c.read_count > 0) {
            badge = '<span class="badge badge-info badge-sm">READ</span>';
        } else {
            badge = '<span class="text-xs text-dim">sent</span>';
        }

        return `
            <div class="conv-item${isActive}" data-uid="${c.tg_user_id}" onclick="openChat(${c.tg_user_id})">
                <div class="conv-avatar">${initial}</div>
                <div class="conv-info">
                    <div class="conv-top">
                        <span class="conv-name">${escHtml(name)}</span>
                        <span class="conv-time">${c.last_time}</span>
                    </div>
                    <div class="conv-preview">
                        <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${dirPrefix}${escHtml(c.last_message)}</span>
                        ${badge}
                    </div>
                </div>
                ${unread}
            </div>
        `;
    }).join('');
}

function escHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
}

// Open chat
async function openChat(tgUserId) {
    activeUserId = tgUserId;

    // Highlight active conversation
    document.querySelectorAll('.conv-item').forEach(el => {
        el.classList.toggle('active', parseInt(el.dataset.uid) === tgUserId);
    });

    // Show message panel
    document.getElementById('msg-placeholder').style.display = 'none';
    const active = document.getElementById('msg-active');
    active.style.display = 'flex';

    // Set header
    const conv = conversations.find(c => c.tg_user_id === tgUserId);
    if (conv) {
        const name = (conv.tg_name && conv.tg_name !== 'Contact' ? conv.tg_name : null) || conv.tg_username || conv.contact_phone || `User ${tgUserId}`;
        document.getElementById('msg-avatar').textContent = name[0].toUpperCase();
        document.getElementById('msg-name').textContent = name;
        document.getElementById('msg-username').textContent = conv.tg_username ? `@${conv.tg_username}` : '';
    }

    // Show loading
    const loading = document.getElementById('msg-loading');
    const body = document.getElementById('msg-body');
    loading.classList.remove('hidden');
    body.style.display = 'none';

    // Load messages
    const res = await fetch(`/api/chats/${tgUserId}/messages?per_page=200`);
    const data = await res.json();

    loading.classList.add('hidden');
    body.style.display = '';
    body.innerHTML = '';

    data.messages.forEach(m => {
        appendMessage(m);
    });

    body.scrollTop = body.scrollHeight;

    // Mark as read
    fetch(`/api/chats/${tgUserId}/read`, { method: 'POST' });

    // Update unread in sidebar
    if (conv) conv.unread = 0;
    renderConversations(document.getElementById('conv-search').value);
}

function statusIcon(status) {
    if (status === 'read') return '<span class="msg-status read" title="Read">&#10003;&#10003;</span>';
    return '<span class="msg-status sent" title="Sent">&#10003;</span>';
}

function appendMessage(m) {
    const body = document.getElementById('msg-body');
    const row = document.createElement('div');
    row.className = `msg-row ${m.direction}`;
    if (m.tg_message_id) row.dataset.msgId = m.tg_message_id;

    const time = m.created_at.split(' ')[1] || m.created_at;
    const checks = m.direction === 'outgoing' ? statusIcon(m.delivery_status || 'sent') : '';
    row.innerHTML = `
        <div>
            <div class="msg-bubble">${escHtml(m.text)}</div>
            <div class="msg-meta">
                <span class="msg-time">${time}</span>
                ${checks}
            </div>
        </div>
    `;
    body.appendChild(row);
}

// Send reply
async function sendReply() {
    if (!activeUserId) return;
    const input = document.getElementById('reply-input');
    const text = input.value.trim();
    if (!text) return;

    const btn = document.getElementById('send-btn');
    btn.disabled = true;
    input.value = '';

    try {
        const res = await fetch(`/api/chats/${activeUserId}/send`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text })
        });
        const data = await res.json();
        if (data.error) {
            showToast(data.error, 'error');
            return;
        }
        appendMessage(data);
        document.getElementById('msg-body').scrollTop = document.getElementById('msg-body').scrollHeight;
        loadConversations();
    } catch (e) {
        showToast('Failed to send message', 'error');
    } finally {
        btn.disabled = false;
        input.focus();
    }
}

// Enter to send, Shift+Enter for newline
document.getElementById('reply-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendReply();
    }
});

// Auto-resize textarea
document.getElementById('reply-input').addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

// Search
document.getElementById('conv-search').addEventListener('input', function() {
    renderConversations(this.value);
});

// SSE for real-time messages
function connectSSE() {
    if (sseSource) sseSource.close();
    sseSource = new EventSource('/api/chats/stream');

    sseSource.onmessage = function(e) {
        const data = JSON.parse(e.data);

        if (data.type === 'new_message') {
            const msg = data.message;

            if (msg.tg_user_id === activeUserId) {
                appendMessage(msg);
                document.getElementById('msg-body').scrollTop = document.getElementById('msg-body').scrollHeight;
                fetch(`/api/chats/${msg.tg_user_id}/read`, { method: 'POST' });
            }

            loadConversations();
        }

        if (data.type === 'read_receipt') {
            if (data.tg_user_id === activeUserId) {
                document.querySelectorAll('.msg-row.outgoing').forEach(row => {
                    const msgId = parseInt(row.dataset.msgId);
                    if (msgId && msgId <= data.max_id) {
                        const statusEl = row.querySelector('.msg-status');
                        if (statusEl && !statusEl.classList.contains('read')) {
                            statusEl.className = 'msg-status read';
                            statusEl.innerHTML = '&#10003;&#10003;';
                            statusEl.title = 'Read';
                        }
                    }
                });
            }
        }
    };

    sseSource.onerror = function() {
        sseSource.close();
        setTimeout(connectSSE, 3000);
    };
}

// Refresh read status from Telegram
async function refreshReadStatus(silent) {
    const btn = document.getElementById('check-status-btn');
    btn.disabled = true;
    btn.classList.add('loading');
    try {
        const res = await fetch('/api/chats/check-status', { method: 'POST' });
        const data = await res.json();
        if (data.error) {
            if (!silent) showToast(data.error, 'error');
        } else {
            if (!silent && data.updated > 0) showToast(`Updated ${data.updated} conversations`, 'success');
        }
        await loadConversations();
        if (activeUserId) openChat(activeUserId);
    } catch (e) {
        if (!silent) showToast('Failed to check status', 'error');
    } finally {
        btn.disabled = false;
        btn.classList.remove('loading');
    }
}

// Init
async function init() {
    await loadConversations();
    connectSSE();
    refreshReadStatus(true);
    refreshIcons();
}
init();
</script>
{% endblock %}
