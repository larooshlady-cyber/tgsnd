{% extends "base.html" %}
{% block title %}Logs - TG Sender{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Logs</h1>
    <button class="btn btn-outline btn-sm" onclick="exportLogs()">
        <i data-lucide="download" class="icon-sm"></i> Export CSV
    </button>
</div>

<div class="tabs">
    <button class="tab-btn active" onclick="switchTab('send', this)">Send Logs</button>
    <button class="tab-btn" onclick="switchTab('import', this)">Import Logs</button>
</div>

<div class="toolbar">
    <select id="log-status-filter" onchange="loadCurrentLogs(1)">
        <option value="">All statuses</option>
        <option value="sent">Sent</option>
        <option value="failed">Failed</option>
        <option value="peer_flood">Peer Flood</option>
        <option value="not_on_telegram">Not on TG</option>
        <option value="added">Added</option>
        <option value="not_found">Not Found</option>
        <option value="error">Error</option>
    </select>
    <span id="log-total" class="text-sm text-muted"></span>
</div>

<div class="card">
    <div class="table-wrap">
        <table>
            <thead id="log-thead"></thead>
            <tbody id="log-tbody"><tr><td colspan="7" class="text-muted">Loading...</td></tr></tbody>
        </table>
    </div>
    <div class="pagination" id="log-pagination"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentTab = 'send';
let logPage = 1;

function switchTab(tab, btn) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    loadCurrentLogs(1);
}

function loadCurrentLogs(page) {
    logPage = page || 1;
    if (currentTab === 'send') loadSendLogs(logPage);
    else loadImportLogs(logPage);
}

function exportLogs() {
    const status = document.getElementById('log-status-filter').value;
    const params = new URLSearchParams();
    if (status) params.set('status', status);
    params.set('type', currentTab);
    window.location.href = `/api/logs/export?${params}`;
}

async function loadSendLogs(page) {
    const status = document.getElementById('log-status-filter').value;
    const params = new URLSearchParams({ page, per_page: 50 });
    if (status) params.set('status', status);

    document.getElementById('log-thead').innerHTML = `
        <tr><th>Time</th><th>Phone</th><th>Name</th><th>Status</th><th>Account</th><th>Error</th><th>Message</th></tr>`;

    try {
        const data = await api(`/api/logs/send?${params}`);
        document.getElementById('log-total').textContent = `${data.total} entries`;

        const tbody = document.getElementById('log-tbody');
        if (data.logs.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" class="text-muted">No logs yet</td></tr>';
        } else {
            tbody.innerHTML = data.logs.map(l => `
                <tr>
                    <td class="text-sm nowrap">${escapeHtml(l.sent_at)}</td>
                    <td>${escapeHtml(l.phone)}</td>
                    <td>${escapeHtml(l.name)}</td>
                    <td>${statusBadge(l.status)}</td>
                    <td>${escapeHtml(l.account)}</td>
                    <td class="text-sm text-danger ${l.error_msg ? 'expandable-error' : ''}" ${l.error_msg ? `title="${escapeHtml(l.error_msg)}" onclick="toggleExpand(this)" style="cursor:pointer"` : ''}>${escapeHtml((l.error_msg || '').substring(0, 50))}${(l.error_msg || '').length > 50 ? '...' : ''}</td>
                    <td class="text-sm truncate">${escapeHtml(l.message_preview)}</td>
                </tr>
            `).join('');
        }

        renderPagination('log-pagination', data.page, data.pages, loadCurrentLogs);
    } catch (e) { toast(e.message, 'error'); }
}

async function loadImportLogs(page) {
    const status = document.getElementById('log-status-filter').value;
    const params = new URLSearchParams({ page, per_page: 50 });
    if (status) params.set('status', status);

    document.getElementById('log-thead').innerHTML = `
        <tr><th>Time</th><th>Phone</th><th>Status</th><th>TG Name</th><th>Username</th><th>Account</th><th>Error</th></tr>`;

    try {
        const data = await api(`/api/logs/import?${params}`);
        document.getElementById('log-total').textContent = `${data.total} entries`;

        const tbody = document.getElementById('log-tbody');
        if (data.logs.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" class="text-muted">No logs yet</td></tr>';
        } else {
            tbody.innerHTML = data.logs.map(l => `
                <tr>
                    <td class="text-sm nowrap">${escapeHtml(l.imported_at)}</td>
                    <td>${escapeHtml(l.phone)}</td>
                    <td>${statusBadge(l.status)}</td>
                    <td>${escapeHtml(l.tg_name || '')}</td>
                    <td>${l.tg_username ? '@' + escapeHtml(l.tg_username) : '-'}</td>
                    <td>${escapeHtml(l.account)}</td>
                    <td class="text-sm text-danger ${l.error_msg ? 'expandable-error' : ''}" ${l.error_msg ? `title="${escapeHtml(l.error_msg)}" onclick="toggleExpand(this)" style="cursor:pointer"` : ''}>${escapeHtml((l.error_msg || '').substring(0, 50))}${(l.error_msg || '').length > 50 ? '...' : ''}</td>
                </tr>
            `).join('');
        }

        renderPagination('log-pagination', data.page, data.pages, loadCurrentLogs);
    } catch (e) { toast(e.message, 'error'); }
}

// Expandable error cells
function toggleExpand(el) {
    const full = el.getAttribute('title');
    if (!full) return;
    if (el.dataset.expanded === 'true') {
        el.textContent = full.substring(0, 50) + (full.length > 50 ? '...' : '');
        el.dataset.expanded = 'false';
    } else {
        el.textContent = full;
        el.dataset.expanded = 'true';
    }
}

loadCurrentLogs(1);
</script>
{% endblock %}
